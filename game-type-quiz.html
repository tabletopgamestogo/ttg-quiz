<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Kind of Board Game Do I Enjoy?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Layout: one centered column, a question card that flips to a result "box lid" in the category's color. */
  :root{
    --bg:#18101F;
    --bg-alt:#241A30;
    --bg-alt2:#2E2039;
    --line:#3A2A4A;
    --cream:#F7F1E6;
    --cream-dim:#C9BEDA;
    --red:#E6394A;
    --orange:#F4A259;
    --yellow:#FFD23F;
    --green:#4FB477;
    --purple:#9B5DE5;
    --cat:#FFD23F;       /* set per result from CATEGORY_COLORS */
    --cat-fg:#1A1220;
    --radius:18px;
    --display:'Bungee', 'Arial Black', Impact, sans-serif;
    --body:'Nunito', 'Segoe UI', system-ui, sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 20% 0%, #2A1D38 0%, var(--bg) 55%) var(--bg);
    color:var(--cream);
    font-family:var(--body);
    min-height:100vh;
    padding:32px 16px 64px;
  }
  .app{ width:100%; max-width:600px; margin:0 auto; display:flex; flex-direction:column; gap:22px; }
  .brand{ text-align:center; }
  .brand .logo{ width:min(300px,100%); height:auto; border-radius:var(--radius); box-shadow:0 10px 25px rgba(0,0,0,0.4); }

  .card{
    background:var(--bg-alt);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px 24px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }
  h1,h2,h3{ font-family:var(--display); font-weight:400; text-wrap:balance; margin:0; letter-spacing:0.5px; }
  h1{ font-size:clamp(1.5rem, 5.5vw, 2.1rem); line-height:1.15; }
  h2{ font-size:clamp(1.15rem, 4.2vw, 1.45rem); line-height:1.25; }
  h3{ font-size:1rem; line-height:1.3; }
  p{ line-height:1.6; margin:0; }
  .eyebrow{ font-weight:900; font-size:0.75rem; letter-spacing:2px; text-transform:uppercase; color:var(--orange); }
  .dim{ color:var(--cream-dim); }

  /* intro */
  .intro{ display:flex; flex-direction:column; gap:16px; text-align:center; align-items:center; }
  .shelf{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
  .shelf span{
    font-size:0.78rem; font-weight:800; padding:6px 10px; border-radius:8px;
    background:var(--c); color:var(--f);
  }

  .btn{
    font-family:var(--display); font-size:1rem; letter-spacing:0.5px;
    background:var(--yellow); color:#1A1220; border:0; border-radius:12px;
    padding:14px 26px; cursor:pointer; transition:transform 0.15s ease, box-shadow 0.15s ease;
    text-decoration:none; display:inline-block;
  }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(255,210,63,0.3); }
  .btn.ghost{ background:transparent; color:var(--cream); border:2px solid var(--line); }
  .btn:focus-visible, .opt:focus-visible, .link:focus-visible{ outline:3px solid var(--cream); outline-offset:3px; }

  /* question */
  .qhead{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
  .count{ font-weight:900; font-size:0.85rem; color:var(--cream-dim); font-variant-numeric:tabular-nums; }
  .bar{ height:6px; background:var(--bg-alt2); border-radius:3px; overflow:hidden; margin-bottom:22px; }
  .bar i{ display:block; height:100%; background:linear-gradient(90deg, var(--orange), var(--yellow)); transition:width 0.35s ease; }
  .opts{ display:grid; gap:10px; margin-top:20px; }
  .opt{
    text-align:left; font-family:var(--body); font-size:1rem; font-weight:700; color:var(--cream);
    background:var(--bg-alt2); border:2px solid transparent; border-radius:14px;
    padding:14px 16px; cursor:pointer; display:flex; gap:12px; align-items:flex-start;
    transition:border-color 0.15s ease, transform 0.15s ease;
  }
  .opt:hover{ border-color:var(--orange); transform:translateX(3px); }
  .opt .key{
    flex:none; width:26px; height:26px; border-radius:7px; background:var(--bg);
    display:grid; place-items:center; font-family:var(--display); font-size:0.8rem; color:var(--yellow);
  }
  .opt .txt{ min-width:0; line-height:1.45; }
  .back{ margin-top:16px; background:none; border:0; color:var(--cream-dim); font-family:var(--body); font-weight:800; cursor:pointer; padding:4px 0; }
  .back:hover{ color:var(--cream); }

  /* result */
  .lid{
    background:var(--cat); color:var(--cat-fg);
    border-radius:var(--radius); padding:28px 24px;
    display:flex; flex-direction:column; gap:10px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }
  .lid .eyebrow{ color:inherit; opacity:0.75; }
  .lid .persona{ font-family:var(--display); font-size:clamp(1.7rem, 7vw, 2.5rem); line-height:1.05; }
  .lid .catname{ font-weight:900; font-size:1rem; }
  .lid p{ font-weight:600; }

  .section{ display:flex; flex-direction:column; gap:14px; }
  .mix{ display:grid; gap:10px; }
  .mixrow{ display:grid; grid-template-columns:minmax(0,1fr) 44px; gap:6px 10px; align-items:center; }
  .mixrow .lbl{ font-weight:800; font-size:0.9rem; min-width:0; }
  .mixrow .pct{ font-weight:900; text-align:right; font-variant-numeric:tabular-nums; font-size:0.9rem; }
  .mixrow .track{ grid-column:1 / -1; height:10px; background:var(--bg-alt2); border-radius:5px; overflow:hidden; }
  .mixrow .track i{ display:block; height:100%; border-radius:5px; }

  .games{ display:grid; gap:12px; }
  .game{
    background:var(--bg-alt2); border-radius:14px; padding:16px;
    display:flex; flex-direction:column; gap:8px; min-width:0;
  }
  .game .meta{ display:flex; flex-wrap:wrap; gap:6px; }
  .tag{ font-size:0.75rem; font-weight:800; padding:3px 8px; border-radius:6px; background:var(--bg); color:var(--cream-dim); }
  .game p{ font-size:0.92rem; color:var(--cream-dim); }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chips span{ font-size:0.82rem; font-weight:700; padding:6px 10px; border-radius:8px; background:var(--bg-alt2); }

  .also{ border-left:4px solid var(--also, var(--cream-dim)); padding-left:14px; display:flex; flex-direction:column; gap:6px; }

  .cta{ display:flex; flex-direction:column; gap:14px; }
  .cta .row{ display:flex; flex-wrap:wrap; gap:10px; }
  .link{ color:var(--yellow); font-weight:800; }

  .footnote{ text-align:center; font-size:0.85rem; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <img src="assets/logo-banner.png" alt="TableTop Games To Go" class="logo">
  </div>
  <main id="screen" class="card" aria-live="polite"></main>
  <p class="footnote dim">Results use the 7 game categories on the TableTop Games To Go shelf.</p>
</div>

<script src="site-config.js"></script>
<script src="board-games-data.js"></script>
<script>
// ---------- CATEGORIES ----------
// Keys are the exact category names used in rental-desk/games.json and board-games-data.js.
const CATS = {
  "Strategy Showcase": {
    persona: "The Mastermind",
    blurb: "You like a game you can sink into. Long-term plans, engines that snowball, and a final score you earned turn by turn. The thicker the rulebook, the better.",
    featured: ["7 Wonders", "Everdell", "Spirit Island", "Splendor"]
  },
  "Family & Accessible Strategy": {
    persona: "The Weekend Builder",
    blurb: "You want real decisions without a two-hour rules lesson. Building routes, maps, and little worlds that anyone at the table, from Lola to your barkada, can pick up in one round.",
    featured: ["Ticket to Ride Europe", "Carcassonne", "Cascadia", "Catan"]
  },
  "Cooperative Missions": {
    persona: "The Team Player",
    blurb: "You'd rather win together than beat your friends. Give you a crisis, a ticking clock, and a team that has to talk it out, and you're happy even when the game wins.",
    featured: ["Pandemic", "Sky Team + Sky Team Turbulence", "The Crew: Quest for Planet Nine", "Horrified: Universal Monsters"]
  },
  "Bluffing & Social Deduction": {
    persona: "The Poker Face",
    blurb: "The best part of game night is the people. Reading faces, keeping a secret, and pointing fingers at the one who's definitely lying (it's you).",
    featured: ["The Resistance: Avalon", "Coup + Coup Reformation", "Spyfall"]
  },
  "Party & Group Fun": {
    persona: "The Life of the Party",
    blurb: "The more people, the better. You want loud rounds, quick laughs, and rules simple enough to explain while someone's still ordering food.",
    featured: ["Dixit + Expansion", "Exploding Kittens", "Hues and Cues", "King of Tokyo"]
  },
  "Quick Card & Tabletop Fillers": {
    persona: "The Quick Draw",
    blurb: "Short, snappy, and always one more round. You love small-box card games that fit in a bag, play in 15 minutes, and reward fast hands and sharp eyes.",
    featured: ["Sushi Go", "Love Letter", "Scout", "Taco Cat Goat Cheese Pizza"]
  },
  "Unmatched Battle Arena": {
    persona: "The Duelist",
    blurb: "Pick a hero, face one rival, and fight it out. You love asymmetric powers, trash talk, and tactical head-to-head battles where every card is a move.",
    featured: ["Unmatched Battle of Legends Vol.1", "Unmatched COBBLE AND FOG", "Unmatched TMNT WITH SHREDDER AND KRANG", "Unmatched ROBINHOOD BIGFOOT"]
  }
};
const SS = "Strategy Showcase", FA = "Family & Accessible Strategy", CO = "Cooperative Missions",
      BL = "Bluffing & Social Deduction", PA = "Party & Group Fun", QC = "Quick Card & Tabletop Fillers",
      UN = "Unmatched Battle Arena";

// ---------- QUESTIONS ----------
// Each option awards points to one or two categories (primary 2, secondary 1).
const QUESTIONS = [
  { q: "It's game night. What are you most excited for?", opts: [
    { t: "Pulling off a plan I've been building all game", p: { [SS]: 2, [FA]: 1 } },
    { t: "Teaming up to beat the game itself", p: { [CO]: 2 } },
    { t: "Lying with a straight face and getting away with it", p: { [BL]: 2 } },
    { t: "Laughing so hard I can't breathe", p: { [PA]: 2, [QC]: 1 } }
  ]},
  { q: "Who are you usually playing with?", opts: [
    { t: "Just one other person", p: { [UN]: 2, [CO]: 1 } },
    { t: "Family, including kids or non-gamers", p: { [FA]: 2, [QC]: 1 } },
    { t: "A small group of friends who like a challenge", p: { [SS]: 2, [CO]: 1 } },
    { t: "A big crowd, six people or more", p: { [PA]: 2, [BL]: 1 } }
  ]},
  { q: "How long should one game last?", opts: [
    { t: "15 minutes, then we shuffle and go again", p: { [QC]: 2, [PA]: 1 } },
    { t: "About 30 to 45 minutes", p: { [FA]: 2, [BL]: 1 } },
    { t: "An hour or more. I want to get lost in it", p: { [SS]: 2, [CO]: 1 } },
    { t: "A best-of-three, back to back", p: { [UN]: 2, [QC]: 1 } }
  ]},
  { q: "How do you feel about learning the rules?", opts: [
    { t: "Teach me in two minutes or less", p: { [QC]: 2, [PA]: 1 } },
    { t: "A short explanation is fine", p: { [FA]: 2, [BL]: 1 } },
    { t: "Bring on the thick rulebook", p: { [SS]: 2, [CO]: 1 } },
    { t: "Hand me a character and I'll learn by playing", p: { [UN]: 2 } }
  ]},
  { q: "Pick the table vibe you love most.", opts: [
    { t: "Quiet focus, everyone deep in thought", p: { [SS]: 2 } },
    { t: "Loud chaos and shouting", p: { [PA]: 2 } },
    { t: "Suspicious glances and wild accusations", p: { [BL]: 2 } },
    { t: "Friendly trash talk with one rival", p: { [UN]: 2 } }
  ]},
  { q: "What's your favorite moment in a game?", opts: [
    { t: "Watching my map, route, or little world come together", p: { [FA]: 2, [SS]: 1 } },
    { t: "Using my character's special power at the perfect time", p: { [UN]: 2, [CO]: 1 } },
    { t: "Calling out the liar, or fooling everyone", p: { [BL]: 2 } },
    { t: "Slapping the card first", p: { [QC]: 2, [PA]: 1 } }
  ]},
  { q: "When you lose, it's usually because…", opts: [
    { t: "Someone came straight at me", p: { [UN]: 2, [BL]: 1 } },
    { t: "Someone squeezed out a few more points", p: { [SS]: 1, [FA]: 2 } },
    { t: "We all lost together. The game won this time", p: { [CO]: 2 } },
    { t: "Who cares? The fun was the point", p: { [PA]: 2, [QC]: 1 } }
  ]},
  { q: "Pick a theme.", opts: [
    { t: "Legends and heroes clashing across history", p: { [UN]: 2 } },
    { t: "Trains, nature, and cozy places", p: { [FA]: 2 } },
    { t: "Spies, secret roles, and hidden traitors", p: { [BL]: 2 } },
    { t: "Saving the world from disaster", p: { [CO]: 2, [SS]: 1 } }
  ]},
  { q: "What's your role in the friend group?", opts: [
    { t: "The planner with the spreadsheet", p: { [SS]: 2, [FA]: 1 } },
    { t: "The one who makes sure everyone's included", p: { [CO]: 2, [PA]: 1 } },
    { t: "The instigator", p: { [BL]: 2, [UN]: 1 } },
    { t: "The one with a deck of cards in their bag", p: { [QC]: 2, [PA]: 1 } }
  ]},
  { q: "Pick a snack for the game table.", opts: [
    { t: "Strong coffee for a long session", p: { [SS]: 2, [CO]: 1 } },
    { t: "Chips and dip for everyone to share", p: { [PA]: 2, [FA]: 1 } },
    { t: "Something I can eat with one hand between quick rounds", p: { [QC]: 2 } },
    { t: "An energy drink before battle", p: { [UN]: 2 } }
  ]},
  { q: "How do you feel about luck in games?", opts: [
    { t: "Keep it to a minimum. Skill should win", p: { [SS]: 2, [UN]: 1 } },
    { t: "A little luck keeps it fair for everyone", p: { [FA]: 2, [CO]: 1 } },
    { t: "Luck is what makes it funny", p: { [PA]: 2, [QC]: 1 } },
    { t: "I make my own luck by bluffing", p: { [BL]: 2 } }
  ]},
  { q: "Someone at the table is new. What do you do?", opts: [
    { t: "Sit next to them and help on their turn", p: { [CO]: 2, [FA]: 1 } },
    { t: "Pick a game they can learn in one round", p: { [QC]: 2, [PA]: 1 } },
    { t: "Hand them a hero and let them fight me", p: { [UN]: 2 } },
    { t: "Let them in on the secret… or not", p: { [BL]: 2 } }
  ]},
  { q: "What do you want to talk about after the game?", opts: [
    { t: "The clever move that won it", p: { [SS]: 2 } },
    { t: "How close we came to saving the day", p: { [CO]: 2 } },
    { t: "Who betrayed who", p: { [BL]: 2, [UN]: 1 } },
    { t: "The funniest moment of the night", p: { [PA]: 2 } }
  ]},
  { q: "How competitive are you, really?", opts: [
    { t: "Very. I play to win", p: { [UN]: 2, [SS]: 1 } },
    { t: "Competitive, but friendly about it", p: { [FA]: 2, [QC]: 1 } },
    { t: "I'd rather win with the team", p: { [CO]: 2 } },
    { t: "I'm just here for the fun", p: { [PA]: 2, [BL]: 1 } }
  ]},
  { q: "Which game piece speaks to you?", opts: [
    { t: "A deck of cards", p: { [QC]: 2, [BL]: 1 } },
    { t: "Hero figures with special powers", p: { [UN]: 2 } },
    { t: "Tiles and little wooden meeples", p: { [FA]: 2 } },
    { t: "A board covered in tokens and resources", p: { [SS]: 2, [CO]: 1 } }
  ]},
  { q: "Your ideal game night is…", opts: [
    { t: "Friday with the barkada until late", p: { [PA]: 2, [BL]: 1 } },
    { t: "A Sunday afternoon with family", p: { [FA]: 2 } },
    { t: "One-on-one with a partner or rival", p: { [UN]: 2, [CO]: 1 } },
    { t: "Quick rounds during a break", p: { [QC]: 2 } }
  ]},
  { q: "What makes you want to play a game again?", opts: [
    { t: "Trying a different strategy every time", p: { [SS]: 2 } },
    { t: "A new hero to try out", p: { [UN]: 2 } },
    { t: "New people to read and fool", p: { [BL]: 2 } },
    { t: "A harder challenge level to beat together", p: { [CO]: 2 } }
  ]},
  { q: "How do you handle pressure?", opts: [
    { t: "I love a ticking timer", p: { [CO]: 2, [QC]: 1 } },
    { t: "I keep calm and keep a straight face", p: { [BL]: 2 } },
    { t: "I slow down and think it through", p: { [SS]: 1, [FA]: 2 } },
    { t: "I yell and roll the dice", p: { [PA]: 2, [UN]: 1 } }
  ]},
  { q: "Pick a superpower.", opts: [
    { t: "Seeing three moves ahead", p: { [SS]: 2 } },
    { t: "Knowing when someone's lying", p: { [BL]: 2 } },
    { t: "Lightning-fast reflexes", p: { [QC]: 2 } },
    { t: "Making the whole room laugh", p: { [PA]: 2 } }
  ]},
  { q: "If you could rent one box this weekend, it would be…", opts: [
    { t: "The biggest box with the most pieces", p: { [SS]: 2, [CO]: 1 } },
    { t: "The one that fits ten people", p: { [PA]: 2, [BL]: 1 } },
    { t: "The one I can teach my Lola", p: { [FA]: 2, [QC]: 1 } },
    { t: "The one with a rival to beat", p: { [UN]: 2 } }
  ]}
];

// Every question also gets "All of the above": 1 point to each category its other
// options touch, so a yes-to-everything answer spreads interest instead of stacking it.
QUESTIONS.forEach(q => {
  const p = {};
  q.opts.forEach(o => Object.keys(o.p).forEach(c => p[c] = 1));
  q.opts.push({ t: "All of the above", p, all: true });
});

// ---------- SCORING ----------
const MAX = {};
Object.keys(CATS).forEach(c => MAX[c] = 0);
QUESTIONS.forEach(q => Object.keys(CATS).forEach(c => {
  MAX[c] += Math.max(...q.opts.map(o => o.p[c] || 0));
}));

// Scores are normalized by each category's best-possible total so categories that
// appear in fewer options aren't disadvantaged. Ties go to the category the
// player picked most recently.
function rank(answers) {
  const raw = {}, last = {};
  Object.keys(CATS).forEach(c => { raw[c] = 0; last[c] = -1; });
  answers.forEach((ai, qi) => {
    const p = QUESTIONS[qi].opts[ai].p;
    Object.keys(p).forEach(c => { raw[c] += p[c]; if (p[c] === 2) last[c] = qi; });
  });
  return Object.keys(CATS)
    .map(c => ({ cat: c, score: raw[c] / MAX[c] }))
    .sort((a, b) => (b.score - a.score) || (last[b.cat] - last[a.cat]));
}

// ---------- RENDER ----------
const { BOARD_GAMES, CATEGORY_COLORS } = window.BoardGamesData;
const SITE_CFG = (window.SiteConfig && window.SiteConfig.SITE) || {
  facebookUrl: "https://www.facebook.com/tabletopgamestogo",
  bookingFormUrl: "https://docs.google.com/forms/d/e/1FAIpQLSfKprdBPWiibzsPFCuH8bpvjHnIOZ5nFEvEN14EmniVHX8EIw/viewform"
};
const screen = document.getElementById('screen');
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
let answers = [];

function renderIntro() {
  const shelf = Object.keys(CATS).map(c => {
    const col = CATEGORY_COLORS[c];
    return `<span style="--c:${col.bg};--f:${col.fg}">${esc(c)}</span>`;
  }).join('');
  screen.innerHTML = `
    <div class="intro">
      <span class="eyebrow">${QUESTIONS.length} questions · about 4 minutes</span>
      <h1>What kind of board game do I enjoy?</h1>
      <p class="dim">Answer for yourself, not your group. We'll match you to one of the seven categories on our rental shelf and pick games from it for you to try.</p>
      <div class="shelf">${shelf}</div>
      <button class="btn" id="start">Start the quiz</button>
    </div>`;
  document.getElementById('start').onclick = () => { answers = []; renderQuestion(); };
}

function renderQuestion() {
  const i = answers.length, Q = QUESTIONS[i];
  screen.innerHTML = `
    <div class="qhead"><span class="eyebrow">Question ${i + 1}</span><span class="count">${i + 1} / ${QUESTIONS.length}</span></div>
    <div class="bar"><i style="width:${(i / QUESTIONS.length) * 100}%"></i></div>
    <h2>${esc(Q.q)}</h2>
    <div class="opts">${Q.opts.map((o, k) => `
      <button class="opt" data-k="${k}"><span class="key">${'ABCDE'[k]}</span><span class="txt">${esc(o.t)}</span></button>`).join('')}
    </div>
    ${i > 0 ? '<button class="back" id="back">← Back</button>' : ''}`;
  screen.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    answers.push(+b.dataset.k);
    answers.length === QUESTIONS.length ? renderResult() : renderQuestion();
  });
  const back = document.getElementById('back');
  if (back) back.onclick = () => { answers.pop(); renderQuestion(); };
  screen.querySelector('.opt').focus({ preventScroll: true });
}

function gamesFor(cat) {
  const inCat = BOARD_GAMES.filter(g => g.category === cat);
  const byName = n => inCat.find(g => g.name === n);
  const picks = CATS[cat].featured.map(byName).filter(Boolean);
  const rest = inCat.filter(g => !picks.includes(g)).map(g => g.name);
  return { picks, rest };
}

function renderResult() {
  const ranked = rank(answers);
  const top = ranked[0], second = ranked[1];
  const info = CATS[top.cat], col = CATEGORY_COLORS[top.cat];
  const { picks, rest } = gamesFor(top.cat);
  const total = ranked.reduce((s, r) => s + r.score, 0) || 1;
  const allCount = answers.filter((ai, qi) => QUESTIONS[qi].opts[ai].all).length;
  const omnivore = allCount >= QUESTIONS.length / 2
    ? `<p>You picked "All of the above" ${allCount} times out of ${QUESTIONS.length}. You'll probably enjoy almost anything on our shelf, but this is where we'd start.</p>`
    : '';

  screen.className = '';
  screen.innerHTML = `
    <div class="section">
      <div class="lid" style="--cat:${col.bg};--cat-fg:${col.fg}">
        <span class="eyebrow">You're</span>
        <div class="persona">${esc(info.persona)}</div>
        <div class="catname">Your shelf: ${esc(top.cat)}</div>
        <p>${esc(info.blurb)}</p>
        ${omnivore}
      </div>

      <div class="card section">
        <h3>Your game mix</h3>
        <div class="mix">${ranked.slice(0, 4).map(r => {
          const c = CATEGORY_COLORS[r.cat], pct = Math.round(r.score / total * 100);
          return `<div class="mixrow"><span class="lbl">${esc(r.cat)}</span><span class="pct">${pct}%</span>
            <span class="track"><i style="width:${pct}%;background:${c.bg}"></i></span></div>`;
        }).join('')}</div>
      </div>

      <div class="card section">
        <h3>Games to try first</h3>
        <div class="games">${picks.map(g => `
          <div class="game">
            <h3>${esc(g.name)}</h3>
            <div class="meta">
              <span class="tag">${esc(g.players)}</span>
              <span class="tag">${esc(g.durationExperience)}</span>
              <span class="tag">${esc(g.mode)}</span>
            </div>
            <p>${esc(g.description)}</p>
          </div>`).join('')}
        </div>
        ${rest.length ? `<span class="eyebrow">Also on this shelf</span><div class="chips">${rest.map(n => `<span>${esc(n)}</span>`).join('')}</div>` : ''}
      </div>

      <div class="card also" style="--also:${CATEGORY_COLORS[second.cat].bg}">
        <span class="eyebrow">Close second</span>
        <h3>${esc(CATS[second.cat].persona)} · ${esc(second.cat)}</h3>
        <p class="dim">Try ${gamesFor(second.cat).picks.slice(0, 2).map(g => esc(g.name)).join(' or ')} when you want a change of pace.</p>
      </div>

      <div class="card cta">
        <h3>Play it at home</h3>
        <p class="dim">TableTop Games To Go delivers these games to your door in Metro Manila. Send us your result on Facebook, or book a rental with the form.</p>
        <div class="row">
          <a class="btn" href="${esc(SITE_CFG.bookingFormUrl)}" target="_blank" rel="noopener">Book a rental</a>
          <a class="btn ghost" href="${esc(SITE_CFG.facebookUrl)}" target="_blank" rel="noopener">Message us on Facebook</a>
        </div>
        <button class="back" id="again">↺ Take the quiz again</button>
      </div>
    </div>`;
  document.getElementById('again').onclick = () => { screen.className = 'card'; renderIntro(); };
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderIntro();
</script>
</body>
</html>
